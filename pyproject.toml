[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pro-a"
version = "0.2.1"
description = "Research knowledge ingestion engine with IMA sync"
requires-python = ">=3.10"
dependencies = [
  "requests>=2.31",
  "tomli>=2.0; python_version < '3.11'",
  "pypdf>=4.0",
  "python-docx>=1.1",
  "openpyxl>=3.1",
  "python-pptx>=0.6.23",
  "cos-python-sdk-v5>=1.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
pro-a = "pro_a.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]

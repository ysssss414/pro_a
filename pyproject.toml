[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pro-a"
version = "0.3.0"
description = "Local canonical knowledge engine for long-term research"
requires-python = ">=3.10"
dependencies = [
  "requests>=2.31",
  "tomli>=2.0; python_version < '3.11'",
  "pypdf>=4.0",
  "pymupdf==1.28.2",
  "pymupdf-layout==1.28.2",
  "python-docx>=1.1",
  "openpyxl>=3.1",
  "python-pptx>=0.6.23",
  "cos-python-sdk-v5>=1.9",
  "fastapi>=0.115",
  "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[project.scripts]
pro-a = "pro_a.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
